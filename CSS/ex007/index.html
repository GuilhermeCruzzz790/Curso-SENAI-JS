<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        div {
            background-color: lightblue;
            width: 200px;
            height: 200px;
            border: 3px solid black;
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: center;    
        }

        #Um:hover {
            background-color: red;
            color: white;
            font-size: 25px;
        }
        
        #Dois:hover {
            background-color: green;
            color: white;
            font-size: 25px;
        }
        
        #Tres:hover {
            background-color:blue;
            color: white;
            font-size: 25px;
        }

    </style>
</head>
<body>
    <h1>Aprendendo Pseudo-Classes</h1>

    <div id="Um">01</div>
    
    <div id="Dois">02</div>
    
    <div id="Tres">03</div>

</body>
</html>
