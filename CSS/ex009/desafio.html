<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos</title>
    <style>
        
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

            #linhaum {
            background-color: burlywood;
            display: flex; 
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 40px;
        }

            #linhadois {
            background-color: burlywood;
            display: flex;
            justify-content: end;
            align-items: center;
            margin-bottom: 40px;
        }
        
            #linhatres {
            background-color: burlywood;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }
        
            #linhaquatro {
            background-color: burlywood;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
            
            #linhacinco {
            background-color: burlywood;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-bottom: 40px;
        }
            
            #linhaseis {
            background-color: burlywood;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 40px;
        }

        .item {
            background-color: chocolate;
            padding: 5px;
            border: 1px solid black;
            /* margin: 10px; */
        }

    </style>
</head>
<body>
    <div id="linhaum">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>
    <div id="linhadois">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>
    
    <div id="linhatres">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>
    
    <div id="linhaquatro">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>
    
    <div id="linhacinco">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>

    </div>
    
    <div id="linhaseis">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>
</body>
</html>
