<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-left: 20px;
        }

        #noticias {
            display: flex;
            background-color: aqua;
            flex-direction: row;
            text-align: center;
            font-size: 30px;
        }

        P{
            background-color: lightblue;
            margin: 20px;
            padding: 10px;
            width: 200px;
            height: 200px;
        }
        </style>
</head>
<body>

    <!-- Precisamos adicionar o display: flex; no container (pai dos elementos que precisam ser flexíveis)-->
    
    <h1>FlexBox</h1>

    <section id="noticias">

        <p>A</p>
    
        <p>B</p>
    
        <p>C</p>
    
    </section>

</body>
</html>
